<div class="auth-field">
    <label class="auth-label" for="id_password1">
        {{ label1|default:"Hasło" }}<span class="auth-required" aria-hidden="true">*</span>
    </label>
    <input class="auth-input" type="password" id="id_password1" name="password1"
           autocomplete="new-password"{% if pwd_help_texts %} aria-describedby="password-rules"{% endif %} required>
</div>

<div class="auth-field">
    <label class="auth-label" for="id_password2">
        {{ label2|default:"Powtórz hasło" }}<span class="auth-required" aria-hidden="true">*</span>
    </label>
    <input class="auth-input" type="password" id="id_password2" name="password2"
           autocomplete="new-password"{% if pwd_help_texts %} aria-describedby="password-rules"{% endif %} required>
</div>
