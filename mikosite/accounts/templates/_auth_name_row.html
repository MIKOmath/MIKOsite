<div class="auth-row">
    <div class="auth-field">
        <label class="auth-label" for="first_name">
            Imię{% if not locked %}<span class="auth-required" aria-hidden="true">*</span>{% endif %}
        </label>
        <input class="auth-input" type="text" id="first_name" name="first_name"
               value="{{ first_value|default_if_none:'' }}"
               autocomplete="given-name"
               {% if locked %}readonly aria-describedby="name-locked-hint"{% else %}required{% endif %}>
    </div>

    <div class="auth-field">
        <label class="auth-label" for="last_name">
            Nazwisko{% if not locked %}<span class="auth-required" aria-hidden="true">*</span>{% endif %}
        </label>
        <input class="auth-input" type="text" id="last_name" name="last_name"
               value="{{ last_value|default_if_none:'' }}"
               autocomplete="family-name"
               {% if locked %}readonly aria-describedby="name-locked-hint"{% else %}required{% endif %}>
    </div>
</div>
{% if locked %}
<p class="auth-hint" id="name-locked-hint">
    Administrator ograniczył możliwość zmiany imienia i nazwiska dla tego konta.
</p>
{% endif %}
