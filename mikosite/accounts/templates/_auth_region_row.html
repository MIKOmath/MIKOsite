
<div class="auth-row">
    <div class="auth-field">
        <label class="auth-label" for="region">
            Województwo<span class="auth-required" aria-hidden="true">*</span>
        </label>
        <select class="auth-select" id="region" name="region" autocomplete="address-level1" required>
            {% if show_region_placeholder %}
                <option value="" disabled selected>Wybierz z listy</option>
            {% endif %}
            {% for code, label in region_choices %}
                <option value="{{ code }}"{% if selected_region and selected_region == code %} selected{% endif %}>{{ label }}</option>
            {% endfor %}
        </select>
    </div>

    <div class="auth-field">
        <label class="auth-label" for="date_of_birth">
            Data urodzenia{% if dob_required %}<span class="auth-required" aria-hidden="true">*</span>{% endif %}
        </label>
        <input class="auth-input" type="date" id="date_of_birth" name="date_of_birth"
               value="{{ dob_value|default_if_none:'' }}"
               min="1900-01-01" autocomplete="bday"
               {% if dob_required %}required{% endif %}>
    </div>
</div>
