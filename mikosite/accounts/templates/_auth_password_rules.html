
{% if pwd_help_texts %}
    <section class="auth-aside__card">
        <h2 class="auth-aside__title">Zasady hasła</h2>
        <span class="auth-rule" aria-hidden="true"></span>

        {# list-style:none strips list semantics in Safari, so the role is restated. #}
        <ul class="auth-rules" id="password-rules" role="list">
            {% for txt in pwd_help_texts %}
                <li>{{ txt }}</li>
            {% endfor %}
        </ul>
    </section>
{% endif %}
